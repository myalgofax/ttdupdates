name: Fetch TTD News

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '0 9 * * *'    # 2:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TTD News API
        run: |
          curl -v "https://ttdevasthanams.ap.gov.in/cms/api/universal-latest-updates?populate=*" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://ttdevasthanams.ap.gov.in/" \
            -H "Origin: https://ttdevasthanams.ap.gov.in" \
            -o docs/news.json
          echo "File size: $(wc -c < docs/news.json) bytes"
          cat docs/news.json | head -c 200

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "Update TTD news"
          git push
