name: Fetch TTD News

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '0 9 * * *'    # 2:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TTD News API
        run: |
          curl -s "https://ttdevasthanams.ap.gov.in/cms/api/universal-latest-updates?populate=*" \
            -H "User-Agent: Mozilla/5.0" \
            -H "Accept: application/json" \
            -o docs/news.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "Update TTD news"
          git push
